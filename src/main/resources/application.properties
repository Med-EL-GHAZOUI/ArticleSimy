# ========================
# APPLICATION
# ========================
spring.application.name=Articlesimy
server.port=8080

# ========================
# DATABASE (MySQL 8)
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/ArticleSimy_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# JWT CONFIGURATION
# ========================
jwt.secret=ArticlesimySecretKeyArticlesimySecretKey2026
jwt.expiration=900000
jwt.refresh-expiration=2592000000

# ========================
# 2FA CONFIGURATION
# ========================
app.2fa.code-length=6
app.2fa.code-expiry-minutes=5

# ========================
# EMAIL (Spring Mail)
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ========================
# FILE UPLOAD
# ========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ========================
# SWAGGER / OPENAPI
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ========================
# CACHE
# ========================
spring.cache.type=simple

# ========================
# WEBSOCKET
# ========================
app.websocket.endpoint=/ws
app.websocket.allowed-origins=http://localhost:5173,http://localhost:3000

# ========================
# SCHEDULING
# ========================
spring.task.scheduling.pool.size=5